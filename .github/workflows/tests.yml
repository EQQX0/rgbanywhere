# Unit tests on every push. They run against a stub OpenRGB SDK server: nothing here downloads OpenRGB,
# installs PawnIO or touches lighting hardware, and only openrgb-python is installed (no pywebview or pywin32).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install openrgb-python
        run: python -m pip install openrgb-python==0.3.8
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

  lint:
    # pyflakes reads every Python file without importing it, so it also checks rgb_app.pyw and cooler.py,
    # which need Windows and pywebview to import
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pyflakes
        run: python -m pip install pyflakes
      - name: Run pyflakes
        run: python -m pyflakes $(git ls-files '*.py' '*.pyw')

  installer:
    # Cross-compiles the Setup exe with MinGW to catch build errors. The exe is not run or kept.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build installer/setup.cpp
        working-directory: installer
        run: |
          x86_64-w64-mingw32-windres setup.rc -O coff -o setup_res.o
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -static -mwindows -municode -Wall -Werror -o RGB-Anywhere-Setup.exe \
            setup.cpp setup_res.o -lwininet -ladvapi32 -lshell32 -lcomctl32 -lole32 -luuid
